<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>弈五子｜本机版</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f2efe5;color:#18251f;font-family:"Microsoft YaHei",sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;opacity:.18;pointer-events:none;background:radial-gradient(#173f32 .6px,transparent .7px);background-size:7px 7px}.top{height:76px;border-bottom:1px solid #173f3230;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.logo{font:700 23px SimSun;letter-spacing:.2em}.top span:last-child{font:13px SimSun;color:#777;letter-spacing:.2em}.wrap{min-height:calc(100vh - 76px);display:grid;grid-template-columns:minmax(390px,1fr) minmax(320px,440px);gap:6vw;align-items:center;padding:35px 5vw}.boardbox{width:min(74vh,100%);aspect-ratio:1;margin:auto;background:#c99b5c;padding:20px;box-shadow:0 28px 70px #352f1f30;position:relative}.boardbox:after{content:"";position:absolute;inset:0;opacity:.12;pointer-events:none;background:repeating-linear-gradient(4deg,transparent 0 16px,#70471e 17px,transparent 18px)}canvas{width:100%;height:100%;position:relative;z-index:1;display:block;cursor:pointer}.side{max-width:440px}.eyebrow{font-size:11px;letter-spacing:.28em;color:#777}h1{font:600 clamp(46px,5vw,68px)/1.1 SimSun;margin:18px 0 10px;letter-spacing:.06em}h1 em{color:#173f32;font-style:normal}.sub{color:#70766f;font:15px SimSun;letter-spacing:.08em;margin-bottom:28px}.status{display:flex;align-items:center;gap:15px;border-block:1px solid #173f3230;padding:17px 2px;margin-bottom:25px}.dot{width:30px;height:30px;border-radius:50%;background:#17201c;box-shadow:0 2px 5px #aaa}.dot.white{background:white;border:1px solid #aaa}.status small{display:block;color:#777;font-size:11px;letter-spacing:.13em}.status strong{display:block;margin-top:3px;letter-spacing:.05em}.label{font-size:11px;color:#777;letter-spacing:.15em;margin:0 0 8px}.seg{display:grid;grid-template-columns:1fr 1fr;background:#173f3212;padding:4px;margin-bottom:20px}.seg button{border:0;background:transparent;padding:11px;cursor:pointer}.seg button.active{background:#173f32;color:#fff}.actions{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;margin-top:26px}.actions button{padding:13px;border:1px solid #173f32;cursor:pointer}.new{background:#173f32;color:#fff}.undo{background:transparent}.rule{font-size:11px;line-height:1.7;color:#777;margin-top:22px}.winner{color:#a33f2d}@media(max-width:850px){.wrap{grid-template-columns:1fr}.boardbox{width:min(90vw,620px)}.side{margin:auto;width:100%}.top span:last-child{display:none}}@media(max-width:480px){.wrap{padding:20px 14px}.boardbox{padding:12px;width:calc(100vw - 36px)}h1{font-size:42px}}
  </style>
</head>
<body>
  <header class="top"><span class="logo">◈ 弈五子</span><span>一局静心 · 五子连珠</span></header>
  <main class="wrap">
    <div class="boardbox"><canvas id="board" width="720" height="720" aria-label="十五路五子棋棋盘"></canvas></div>
    <section class="side">
      <div class="eyebrow">GOMOKU · 15 × 15</div><h1>落子无悔<br><em>胜负有声</em></h1><p class="sub">在纵横交错之间，先连成五子者胜。</p>
      <div class="status"><i class="dot" id="turnDot"></i><div><small id="step">第 1 手</small><strong id="status">轮到你落子</strong></div></div>
      <p class="label">对局模式</p><div class="seg"><button id="ai" class="active">人机对战</button><button id="friend">双人对弈</button></div>
      <p class="label">谁先落子</p><div class="seg" id="colors"><button id="black" class="active">我要先下 · 黑棋</button><button id="white">让电脑先下 · 我执白</button></div>
      <div class="actions"><button class="new" id="newGame">重新开局 ↗</button><button class="undo" id="undo">悔棋</button></div>
      <p class="rule">规则：黑白双方交替落子，横、竖或斜线率先连成五子即获胜。</p>
    </section>
  </main>
<script>
const N=15,cv=document.querySelector('#board'),ctx=cv.getContext('2d'),statusEl=document.querySelector('#status'),stepEl=document.querySelector('#step'),turnDotEl=document.querySelector('#turnDot'),aiBtn=document.querySelector('#ai'),friendBtn=document.querySelector('#friend'),colorsEl=document.querySelector('#colors'),blackBtn=document.querySelector('#black'),whiteBtn=document.querySelector('#white'),newGameBtn=document.querySelector('#newGame'),undoBtn=document.querySelector('#undo');let b,hist,turn,over,mode='ai',human=1,thinking=false;const dirs=[[1,0],[0,1],[1,1],[1,-1]];
function reset(){b=Array.from({length:N},()=>Array(N).fill(0));hist=[];turn=1;over=false;thinking=false;draw();ui();if(mode==='ai'&&human===2)setTimeout(aiMove,350)}
function win(r,c,p){return dirs.some(([dr,dc])=>{let n=1;for(const s of[-1,1]){let y=r+dr*s,x=c+dc*s;while(b[y]?.[x]===p){n++;y+=dr*s;x+=dc*s}}return n>=5})}
function score(r,c,p){let z=0,W=[0,8,60,500,6000,1e6];for(const[dr,dc]of dirs){let n=1,o=0;for(const s of[-1,1]){let y=r+dr*s,x=c+dc*s;while(b[y]?.[x]===p){n++;y+=dr*s;x+=dc*s}if(b[y]?.[x]===0)o++}z+=W[Math.min(n,5)]*(o===2?1.8:o?1:.1)}return z}
function best(){let q=null,p=human===1?2:1;for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(b[r][c])continue;let near=false;for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++)if(b[r+y]?.[c+x])near=true;if(!near)continue;b[r][c]=p;let w=win(r,c,p),a=score(r,c,p);b[r][c]=human;let block=win(r,c,human),d=score(r,c,human);b[r][c]=0;let s=w?1e9:block?5e8:a+d*1.18+14-Math.abs(r-7)-Math.abs(c-7)+Math.random();if(!q||s>q.s)q={r,c,s}}return q||{r:7,c:7}}
function put(r,c,p){if(b[r][c]||over)return;b[r][c]=p;hist.push({r,c,p});if(win(r,c,p)){over=true;statusEl.textContent=(p===1?'黑棋':'白棋')+'获胜';statusEl.className='winner'}else turn=p===1?2:1;draw();ui()}
function aiMove(){if(over||mode!=='ai'||turn===human)return;thinking=true;ui();setTimeout(()=>{const m=best();put(m.r,m.c,turn);thinking=false;ui()},360)}
function draw(){const S=cv.width,pad=36,g=(S-pad*2)/(N-1);ctx.clearRect(0,0,S,S);ctx.strokeStyle='#3b3225';ctx.lineWidth=1.4;for(let i=0;i<N;i++){let a=pad+i*g;ctx.beginPath();ctx.moveTo(pad,a);ctx.lineTo(S-pad,a);ctx.stroke();ctx.beginPath();ctx.moveTo(a,pad);ctx.lineTo(a,S-pad);ctx.stroke()}for(const r of[3,7,11])for(const c of[3,7,11]){ctx.fillStyle='#3b3225';ctx.beginPath();ctx.arc(pad+c*g,pad+r*g,4,0,Math.PI*2);ctx.fill()}for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(b[r][c]){let x=pad+c*g,y=pad+r*g,grad=ctx.createRadialGradient(x-9,y-10,2,x,y,22);if(b[r][c]===1){grad.addColorStop(0,'#626a66');grad.addColorStop(.35,'#202723');grad.addColorStop(1,'#050806')}else{grad.addColorStop(0,'#fff');grad.addColorStop(.55,'#f4f1e9');grad.addColorStop(1,'#bbb8af')}ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,g*.41,0,Math.PI*2);ctx.fill();if(hist.at(-1)?.r===r&&hist.at(-1)?.c===c){ctx.fillStyle='#c74732';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()}}}
function ui(){stepEl.textContent=over?'本局结果':`第 ${hist.length+1} 手`;if(!over){statusEl.className='';statusEl.textContent=thinking?'电脑正在思考…':mode==='ai'?(turn===human?'轮到你落子':'电脑回合'):`轮到${turn===1?'黑棋':'白棋'}`};turnDotEl.className='dot '+(turn===2?'white':'')}
cv.onclick=e=>{if(over||thinking||(mode==='ai'&&turn!==human))return;const rect=cv.getBoundingClientRect(),s=cv.width/rect.width,pad=36,g=(cv.width-pad*2)/(N-1),c=Math.round((e.offsetX*s-pad)/g),r=Math.round((e.offsetY*s-pad)/g);if(r>=0&&r<N&&c>=0&&c<N&&!b[r][c]){put(r,c,turn);aiMove()}};
newGameBtn.onclick=reset;undoBtn.onclick=()=>{if(!hist.length||thinking)return;let n=mode==='ai'&&hist.length>1?2:1;hist.splice(-n);b=Array.from({length:N},()=>Array(N).fill(0));hist.forEach(m=>b[m.r][m.c]=m.p);turn=hist.length%2?2:1;over=false;statusEl.className='';draw();ui()};
aiBtn.onclick=()=>{mode='ai';aiBtn.className='active';friendBtn.className='';colorsEl.style.display='grid';reset()};friendBtn.onclick=()=>{mode='friend';friendBtn.className='active';aiBtn.className='';colorsEl.style.display='none';reset()};blackBtn.onclick=()=>{human=1;blackBtn.className='active';whiteBtn.className='';reset()};whiteBtn.onclick=()=>{human=2;whiteBtn.className='active';blackBtn.className='';reset()};reset();
</script></body></html>
