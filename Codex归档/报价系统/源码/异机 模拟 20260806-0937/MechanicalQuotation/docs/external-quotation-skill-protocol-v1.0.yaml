openapi: 3.1.0
info:
  title: 机械加工报价系统外接 Skill 接口协议
  version: 1.0.0
  description: |
    外接 Skill 可参与指定报价步骤，也可完成整套报价。所有显示文字必须为中文。
    Skill 不得使用 UC 料号、文件名或图号匹配价格，不得自行发布或覆盖公司正式单价。
    正式价格只能引用请求中传入的已发布价格记录；AI 金额只能作为待确认参考价。
servers:
  - url: http://127.0.0.1:8765
x-folder-transport:
  description: 本地或 SMB 公共槽 Skill 文件夹使用与 /v1/quote 相同的请求和响应 Schema。
  manifest: skill.json
  manifest_example: external-skill-folder-v1.0.example.json
  entrypoint_rules:
    - entrypoint 必须是 Skill 文件夹内的相对 .exe 路径。
    - 系统以 UTF-8 JSON 写入标准输入，Skill 以 UTF-8 JSON 写到标准输出。
    - 正常完成返回码为 0；诊断信息写标准错误，不得混入响应 JSON。
    - 默认超时 60 秒，响应上限 5 MB，不允许 shell 命令或跳出 Skill 文件夹。
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        "200":
          description: Skill 可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/capabilities:
    get:
      operationId: capabilities
      responses:
        "200":
          description: Skill 能力声明，系统设置只能选择这里声明的步骤
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  /v1/quote:
    post:
      operationId: quote
      description: |
        执行 selected_steps 指定的步骤。execution_mode=FULL_QUOTATION 时必须返回完整
        quotation；PARTIAL_STEPS 时只处理所选步骤，未选步骤由内置系统完成并合并。
      parameters:
        - in: header
          name: X-Request-Id
          required: true
          schema: {type: string, minLength: 8, maxLength: 100}
        - in: header
          name: X-Skill-Protocol-Version
          required: true
          schema: {type: string, const: "1.0"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotationSkillRequest"
      responses:
        "200":
          description: 执行完成；业务性待确认仍返回 200，并在 review 中说明
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotationSkillResponse"
        "400":
          description: 请求格式或步骤不受支持
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "422":
          description: 输入资料不足，无法完成强制步骤
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "500":
          description: Skill 内部错误，主系统必须回退内置流程
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
components:
  schemas:
    StepCode:
      type: string
      enum:
        - DOCUMENT_UNDERSTANDING
        - FEATURE_EXTRACTION
        - MATERIAL_CLASSIFICATION
        - PROCESS_PLANNING
        - TIME_ESTIMATION
        - LINE_ITEM_PRICING
        - UNKNOWN_ESTIMATION
        - PRICE_AUDIT
        - REVIEW_RECOMMENDATION
        - QUOTE_ASSEMBLY
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, skill_id, skill_version, protocol_versions]
      properties:
        status: {type: string, enum: [OK, DEGRADED]}
        skill_id: {type: string, pattern: "^[a-z0-9][a-z0-9.-]{2,63}$"}
        skill_version: {type: string}
        protocol_versions:
          type: array
          items: {type: string}
        message_zh: {type: string}
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required:
        - skill_id
        - skill_name_zh
        - skill_version
        - protocol_version
        - supported_steps
        - supports_full_quotation
        - timeout_seconds
      properties:
        skill_id: {type: string}
        skill_name_zh: {type: string}
        skill_version: {type: string}
        protocol_version: {type: string, const: "1.0"}
        supported_steps:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/StepCode"}
        supports_full_quotation: {type: boolean}
        accepted_file_types:
          type: array
          items:
            type: string
            enum: [DWG, DXF, PDF, SLDDRW, SLDPRT, XLSX]
        max_file_bytes: {type: integer, minimum: 1}
        timeout_seconds: {type: integer, minimum: 5, maximum: 600}
        requires_network: {type: boolean, default: false}
    QuotationSkillRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - protocol_version
        - execution_mode
        - selected_steps
        - locale
        - currency
        - quote_policy
        - drawing_package
        - published_pricebook
      properties:
        request_id: {type: string}
        protocol_version: {type: string, const: "1.0"}
        execution_mode:
          type: string
          enum: [PARTIAL_STEPS, FULL_QUOTATION]
        selected_steps:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/StepCode"}
        locale: {type: string, const: zh-CN}
        currency: {type: string, const: CNY}
        requested_by:
          type: object
          additionalProperties: false
          properties:
            user_id: {type: string}
            display_name: {type: string}
            permissions:
              type: array
              items: {type: string}
        quote_policy:
          $ref: "#/components/schemas/QuotePolicy"
        drawing_package:
          $ref: "#/components/schemas/DrawingPackage"
        built_in_context:
          $ref: "#/components/schemas/BuiltInContext"
        published_pricebook:
          $ref: "#/components/schemas/PublishedPricebook"
    QuotePolicy:
      type: object
      additionalProperties: false
      required:
        - prohibit_part_number_matching
        - formal_price_requires_published_record
        - ai_estimate_requires_review
        - tax_rate
      properties:
        prohibit_part_number_matching:
          type: boolean
          const: true
          description: 禁止 UC、图号、文件名或料号价格匹配
        formal_price_requires_published_record:
          type: boolean
          const: true
        ai_estimate_requires_review:
          type: boolean
          const: true
        prefer_lowest_cost_capable_process:
          type: boolean
          default: true
        tax_rate: {type: number, minimum: 0, maximum: 1}
        max_ai_estimate_cny: {type: number, minimum: 0}
        require_evidence: {type: boolean, default: true}
    DrawingPackage:
      type: object
      additionalProperties: false
      required: [drawing_number, quantity, primary_file, files]
      properties:
        drawing_number: {type: string}
        part_name: {type: [string, "null"]}
        quantity: {type: integer, minimum: 1}
        primary_file: {type: string, description: 必须明确等于用户选择的主文件 file_id}
        files:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InputFile"
        extracted_texts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [text, source_file_id]
            properties:
              text: {type: string}
              source_file_id: {type: string}
              page: {type: [integer, "null"]}
              entity_id: {type: [string, "null"]}
              confidence: {type: number, minimum: 0, maximum: 1}
    InputFile:
      type: object
      additionalProperties: false
      required: [file_id, file_name, file_type, sha256, size_bytes]
      properties:
        file_id: {type: string}
        file_name: {type: string}
        file_type:
          type: string
          enum: [DWG, DXF, PDF, SLDDRW, SLDPRT, XLSX]
        sha256: {type: string, pattern: "^[A-Fa-f0-9]{64}$"}
        size_bytes: {type: integer, minimum: 1}
        local_uri:
          type: [string, "null"]
          description: 仅本机受信 Skill 可用；必须为 file URI 或受控临时目录路径
        content_base64:
          type: [string, "null"]
          description: 跨进程或远程 Skill 使用；与 local_uri 至少提供一个
    BuiltInContext:
      type: object
      additionalProperties: true
      description: 内置步骤已有结果；PARTIAL_STEPS 调用时供 Skill 接续处理
      properties:
        material: {type: [string, "null"]}
        dimensions_mm: {type: object, additionalProperties: {type: number}}
        thickness_mm: {type: [number, "null"]}
        weight_kg: {type: [number, "null"]}
        holes: {type: array, items: {type: object}}
        threads: {type: array, items: {type: object}}
        manufacturing_features: {type: object}
        process_plan: {type: array, items: {type: object}}
        existing_quote_items:
          type: array
          items: {$ref: "#/components/schemas/QuoteLineItem"}
        notes: {type: array, items: {type: string}}
    PublishedPricebook:
      type: object
      additionalProperties: false
      required: [price_version_id, published_at, records_sha256, records]
      properties:
        price_version_id: {type: string}
        published_at: {type: string, format: date-time}
        records_sha256: {type: string, pattern: "^[A-Fa-f0-9]{64}$"}
        records:
          type: array
          items:
            $ref: "#/components/schemas/PublishedPriceRecord"
    PublishedPriceRecord:
      type: object
      additionalProperties: true
      required: [company_price_id, target_type, canonical_code, unit_price, unit, price_basis]
      properties:
        company_price_id: {type: string}
        target_type:
          type: string
          enum: [MATERIAL, PROFILE, PROCESS, SURFACE, PURCHASED]
        canonical_code: {type: string}
        display_name_zh: {type: string}
        specification: {type: [string, "null"]}
        unit_price: {type: number, minimum: 0}
        unit: {type: string}
        price_basis: {type: string, enum: [EXCLUDING_TAX, INCLUDING_TAX]}
        effective_from: {type: [string, "null"], format: date}
        origin_supplier_id: {type: [string, "null"]}
        origin_price_record_id: {type: [string, "null"]}
    QuotationSkillResponse:
      type: object
      additionalProperties: false
      required:
        - request_id
        - protocol_version
        - skill_id
        - skill_version
        - status
        - completed_steps
        - step_results
        - warnings_zh
        - review
        - trace
      properties:
        request_id: {type: string}
        protocol_version: {type: string, const: "1.0"}
        skill_id: {type: string}
        skill_version: {type: string}
        status:
          type: string
          enum: [COMPLETE, PARTIAL, REVIEW_REQUIRED, FAILED]
        completed_steps:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/StepCode"}
        step_results:
          type: array
          items: {$ref: "#/components/schemas/StepResult"}
        quotation:
          anyOf:
            - {$ref: "#/components/schemas/QuotationResult"}
            - {type: "null"}
        warnings_zh:
          type: array
          items: {type: string}
        review:
          $ref: "#/components/schemas/ReviewResult"
        trace:
          $ref: "#/components/schemas/ExecutionTrace"
    StepResult:
      type: object
      additionalProperties: false
      required: [step, status, confidence, evidence, output]
      properties:
        step: {$ref: "#/components/schemas/StepCode"}
        status: {type: string, enum: [COMPLETE, PARTIAL, SKIPPED, FAILED]}
        confidence: {type: number, minimum: 0, maximum: 1}
        evidence:
          type: array
          items: {$ref: "#/components/schemas/Evidence"}
        output:
          type: object
          additionalProperties: true
        message_zh: {type: [string, "null"]}
    QuotationResult:
      type: object
      additionalProperties: false
      required:
        - items
        - subtotal_excluding_tax
        - tax_rate
        - tax_amount
        - total_including_tax
        - cost_completion
        - unknown_count
      properties:
        material_code: {type: [string, "null"]}
        material_name_zh: {type: [string, "null"]}
        process_summary_zh: {type: array, items: {type: string}}
        items:
          type: array
          items: {$ref: "#/components/schemas/QuoteLineItem"}
        subtotal_excluding_tax: {type: number, minimum: 0}
        tax_rate: {type: number, minimum: 0, maximum: 1}
        tax_amount: {type: number, minimum: 0}
        total_including_tax: {type: number, minimum: 0}
        cost_completion: {type: number, minimum: 0, maximum: 100}
        unknown_count: {type: integer, minimum: 0}
    QuoteLineItem:
      type: object
      additionalProperties: false
      required:
        - line_id
        - category
        - name_zh
        - quantity
        - unit
        - unit_price
        - amount
        - price_status
        - source
        - confidence
        - evidence
      properties:
        line_id: {type: string}
        category:
          type: string
          enum: [material, process, surface, purchased, other]
        canonical_code: {type: [string, "null"]}
        name_zh: {type: string}
        specification_zh: {type: [string, "null"]}
        quantity: {type: number, minimum: 0}
        unit: {type: string}
        unit_price: {type: number, minimum: 0}
        amount: {type: number, minimum: 0}
        price_status:
          type: string
          enum: [FORMAL, AI_REFERENCE, UNKNOWN]
        source:
          type: string
          enum: [C, M, AI, U]
          description: 外接 Skill 不得产生 H/E；C 必须引用 company_price_id，M 必须有人工审核记录
        company_price_id: {type: [string, "null"]}
        price_version_id: {type: [string, "null"]}
        origin_supplier_id: {type: [string, "null"]}
        confidence: {type: number, minimum: 0, maximum: 1}
        evidence:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Evidence"}
        ai_reference:
          anyOf:
            - {$ref: "#/components/schemas/AiReference"}
            - {type: "null"}
        requires_review: {type: boolean}
        review_reason_zh: {type: [string, "null"]}
    AiReference:
      type: object
      additionalProperties: false
      required: [estimated_unit_price, estimated_amount, unit, reason_zh, confidence]
      properties:
        estimated_unit_price: {type: number, minimum: 0}
        estimated_amount: {type: number, minimum: 0}
        unit: {type: string}
        reason_zh: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
    Evidence:
      type: object
      additionalProperties: false
      required: [evidence_type, description_zh]
      properties:
        evidence_type:
          type: string
          enum: [DRAWING_TEXT, GEOMETRY, PUBLISHED_PRICE, CALCULATION, USER_INPUT, AI_REASONING]
        description_zh: {type: string}
        source_file_id: {type: [string, "null"]}
        entity_id: {type: [string, "null"]}
        company_price_id: {type: [string, "null"]}
        calculation: {type: [string, "null"]}
    ReviewResult:
      type: object
      additionalProperties: false
      required: [decision, risk_score, reasons_zh, required_actions_zh]
      properties:
        decision: {type: string, enum: [PASS, REVIEW, BLOCK]}
        risk_score: {type: number, minimum: 0, maximum: 100}
        reasons_zh: {type: array, items: {type: string}}
        required_actions_zh: {type: array, items: {type: string}}
    ExecutionTrace:
      type: object
      additionalProperties: false
      required:
        - started_at
        - completed_at
        - duration_ms
        - input_sha256
        - pricebook_sha256
        - used_steps
      properties:
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        duration_ms: {type: integer, minimum: 0}
        input_sha256: {type: string, pattern: "^[A-Fa-f0-9]{64}$"}
        pricebook_sha256: {type: string, pattern: "^[A-Fa-f0-9]{64}$"}
        used_steps:
          type: array
          items: {$ref: "#/components/schemas/StepCode"}
        model_or_engine_versions:
          type: object
          additionalProperties: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [request_id, error_code, message_zh, retryable]
      properties:
        request_id: {type: string}
        error_code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNSUPPORTED_STEP
            - UNSUPPORTED_FILE
            - INPUT_INCOMPLETE
            - PRICEBOOK_INVALID
            - TIMEOUT
            - INTERNAL_ERROR
        message_zh: {type: string}
        retryable: {type: boolean}
        details: {type: object, additionalProperties: true}
x-integration-rules:
  selection:
    - 系统必须先调用 /v1/capabilities，再允许管理员选择 supported_steps。
    - FULL_QUOTATION 只有在 supports_full_quotation=true 时可选。
    - Skill 返回的 completed_steps 不得包含请求 selected_steps 之外的步骤。
  merge:
    - PARTIAL_STEPS 按 selected_steps 替换对应中间结果，未选择步骤保留内置结果。
    - 同一费用不得同时由内置规则和 Skill 重复计价；使用 line_id 和 canonical_code 去重。
    - Skill 失败、超时、协议不符或校验失败时，该步骤回退内置系统并记录中文警告。
  formal-price-validation:
    - source=C 时 company_price_id 和 price_version_id 必填，且必须命中请求中的同一条已发布记录。
    - source=AI 或 price_status=AI_REFERENCE 的金额不得计入正式未税、税额和含税总价。
    - source=U 必须 requires_review=true，并尽可能提供 ai_reference。
    - amount 必须等于 quantity 乘 unit_price，允许人民币分位四舍五入误差不超过 0.01 元。
  security:
    - Skill 只能读取请求提供的文件和价格资料，不得扫描其它本机或 SMB 路径。
    - 不得返回、记录或转发 DeepSeek Key、用户库口令、登录密码或访问令牌。
    - 所有请求与响应必须校验大小、超时、JSON Schema 和 SHA-256；日志不得保存图纸二进制正文。
