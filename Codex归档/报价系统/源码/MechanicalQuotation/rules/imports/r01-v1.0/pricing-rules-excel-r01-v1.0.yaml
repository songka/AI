    - tax_amount
    - total_including_tax
    do_not_include_tax_in_cost_subtotal: true
    do_not_apply_tax_when_status_unknown: true
  source_propagation:
    track_separately:
    - quantity_source
    - rate_source
    - formula_source
    final_source: weakest/least-confirmed input source
    company_rate_plus_estimated_time_cannot_be_C: true
